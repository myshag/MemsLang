[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soidlc"
version = "0.1.0"
description = "Compiler from SOIDL (SOI MEMS device language) to 3D models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# FEM layer uses scientific libraries; the core compiler (parser, geometry,
# 2.5D extrusion, software renderer, exporters) remains pure standard library.
dependencies = [
    "scikit-fem>=10",
    "gmsh>=4.13",
]

[project.scripts]
soidlc = "soidlc.cli:main"

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[tool.setuptools]
packages = ["soidlc", "soidlc.fem", "webapp", "webapp.backend"]

# `packages` is an explicit list, so non-Python files are not picked up by
# default -- without this the SOIDL standard library works from a checkout and
# silently vanishes on `pip install`.
[tool.setuptools.package-data]
soidlc = ["lib/*.soidl"]
